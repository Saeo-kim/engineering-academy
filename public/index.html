<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1115" />
    <meta name="description" content="Engineering courses with video lectures, plus a personal knowledge and training system." />
    <title>Engineering Academy</title>
    <!-- App identity: one fixed icon everywhere. See docs/BRANDING.md before changing. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eng Academy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/learning.css" />
    <link rel="stylesheet" href="/css/courses.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#/">
          <img class="brand-mark" src="/favicon.svg" alt="" width="34" height="34" />
          <span class="brand-name">Engineering <br />Academy</span>
        </a>
        <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav">Menu</button>
        <nav id="nav" aria-label="Main"></nav>
        <p class="sidebar-foot">Stored only on this computer</p>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="global-search" role="search">
            <label class="visually-hidden" for="global-search">Search everything</label>
            <input id="global-search" type="search" placeholder="Search knowledge, commands, errors, and workflows" autocomplete="off" spellcheck="false" enterkeyhint="search" />
            <kbd aria-hidden="true">Ctrl K</kbd>
          </div>
          <a class="button primary" href="#/capture" id="topbar-capture">Capture</a>
        </header>
        <main id="view" tabindex="-1"></main>
      </div>
      <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
    </div>
    <div id="login-root" hidden></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="chart-tooltip" class="chart-tooltip" hidden></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
